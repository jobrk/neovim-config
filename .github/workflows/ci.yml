name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl unzip ripgrep
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          echo 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  /tmp/nvim.tar.gz' | sha256sum --check
          sudo tar --extract --gzip --file /tmp/nvim.tar.gz --directory /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/tree-sitter.gz https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.0/tree-sitter-linux-x64.gz
          echo '20a1f39ec1c45f2211492dcb8881c802b643b554bb196869a29ac3778277fa77  /tmp/tree-sitter.gz' | sha256sum --check
          gunzip /tmp/tree-sitter.gz
          sudo install -m 755 /tmp/tree-sitter /usr/local/bin/tree-sitter
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Link configuration
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Provision editor
        run: ./provision.sh

      - name: Check formatting
        run: ~/.local/share/nvim/mason/bin/stylua --check .

      - name: Run smoke test
        run: ./check.sh

      - name: Check repository cleanliness
        run: git diff --exit-code
