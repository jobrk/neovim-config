name: Formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install StyLua
        run: cargo install stylua --locked --version 2.6.0
      - name: Check formatting
        run: stylua --check .
